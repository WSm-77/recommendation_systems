[tools]
uv = "latest"

[settings]
python.uv_venv_auto = "source"

[tasks.sync]
description = "Sync all lab environments"
run = """
#!/usr/bin/env bash
set -euo pipefail
for lab in lab{1..7}; do
  echo "==> $lab"
  uv sync --project "$lab"
done
"""

[tasks.kernels]
description = "Register Jupyter kernels for each lab"
run = """
#!/usr/bin/env bash
set -euo pipefail
for lab in lab{1..7}; do
  echo "==> kernel $lab"
  uv run --project "$lab" python -m ipykernel install --user \
    --name="$lab" \
    --display-name="Python ($lab)"
done
"""

[tasks."lab1:sync"]
description = "Sync lab1"
run = "uv sync --project lab1"

